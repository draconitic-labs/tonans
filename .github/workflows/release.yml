name: Release

# A tag run builds, verifies, and drafts a release with every file and SHA256SUMS. A manual
# run does the same and stops at workflow artifacts. Nothing is published without a person.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TAURI_CLI_VERSION: 2.12.4
  CARGO_ABOUT_VERSION: 0.9.2
  CARGO_ABOUT_SHA256: 9099a59e820c38a68b9d65f300662a567d56562f9a10f6aa4c7e86c17c2566af
  LLVM_MINGW_VERSION: '20261020'
  LLVM_MINGW_SHA256: fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd

jobs:
  linux:
    name: Linux packages
    # 22.04, so the binaries ask for an older glibc than a 24.04 build would.
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK and GTK development packages, and package tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev rpm libarchive-tools
      - name: Install pinned Rust
        run: rustup toolchain install 1.96.1 --profile minimal
      - name: Read the version
        id: version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Every package in the lockfile, so cargo-about can read each one offline.
      - run: cargo fetch --locked
      # The same remap packaging/package.ps1 applies on Windows: no build-machine path in
      # the binaries.
      - name: Remap build paths
        run: echo "RUSTFLAGS=--remap-path-prefix=$HOME/.cargo=/cargo --remap-path-prefix=$GITHUB_WORKSPACE=/tonans" >> "$GITHUB_ENV"
      - name: Build the command
        run: cargo build --release --locked -p tonans-app
      - name: Install cargo-about
        run: |
          archive="$RUNNER_TEMP/cargo-about.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/EmbarkStudios/cargo-about/releases/download/${CARGO_ABOUT_VERSION}/cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_ABOUT_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/cargo-about-${CARGO_ABOUT_VERSION}-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Write the third-party notices for each binary
        run: |
          mkdir -p packaging/out/linux
          for crate in app desktop; do
            notices="packaging/out/linux/NOTICES-$crate.md"
            cargo about generate --frozen --fail -c packaging/about.toml \
              -m "crates/tonans-$crate/Cargo.toml" -o "$notices" packaging/about.hbs
            # The interface's typeface is compiled into both binaries.
            {
              echo '## SIL Open Font License 1.1'
              echo
              echo 'Used by: the Barlow typeface, compiled into the interface'
              echo
              echo '~~~~text'
              cat crates/tonans-app/ui/fonts/OFL.txt
              echo '~~~~'
            } >> "$notices"
            grep -c '^## ' "$notices"
          done
      - name: Build the desktop .deb and .rpm
        working-directory: crates/tonans-desktop
        run: |
          npx --yes "@tauri-apps/cli@${TAURI_CLI_VERSION}" build \
            --bundles deb,rpm --config tauri.linux-release.conf.json -- --locked
      - name: Assemble the release files
        run: |
          version='${{ steps.version.outputs.version }}'
          stem="tonans-${version}-linux-x86_64"
          mkdir -p "dist/$stem"
          cp target/release/tonans "dist/$stem/tonans"
          cp LICENSE README.md "dist/$stem/"
          cp packaging/out/linux/NOTICES-app.md "dist/$stem/NOTICES.md"
          tar -C dist --owner=0 --group=0 --numeric-owner -czf "dist/$stem.tar.gz" "$stem"
          cp "target/release/bundle/deb/Tonans_${version}_amd64.deb" dist/
          cp "target/release/bundle/rpm/Tonans-${version}-1.x86_64.rpm" dist/
          ls -l dist
      - name: Run the packaged programs from their extracted packages
        run: |
          set -euxo pipefail
          version='${{ steps.version.outputs.version }}'
          dist="$GITHUB_WORKSPACE/dist"
          check="$(mktemp -d)"
          cd "$check"
          # A clean environment: nothing from the checkout or the toolchain on PATH.
          bare() { env -i PATH=/usr/bin:/bin HOME="$check/home" "$@"; }
          version_line="^Tonans ${version//./\\.} \(model [0-9]+\.[0-9]+\.[0-9]+"

          echo '::group::tonans, from the tarball'
          tar -xzf "$dist/tonans-${version}-linux-x86_64.tar.gz"
          cli="$check/tonans-${version}-linux-x86_64"
          ls -l "$cli"
          grep -q '^# Third-party notices' "$cli/NOTICES.md"
          grep -q '^## SIL Open Font License 1.1$' "$cli/NOTICES.md"
          grep -q 'Apache License' "$cli/LICENSE"
          bare "$cli/tonans" --version | tee out.txt
          grep -Eq "$version_line" out.txt
          bare "$cli/tonans" --help | tee out.txt
          grep -q 'support@draconitic.com' out.txt
          bare "$cli/tonans" run --project 'Demo - Riverside Works' \
            --workspace "$check/workspace" --out "$check/bundle"
          (cd "$check/bundle" && sha256sum -c SHA256SUMS.txt)
          grep -q 'Planning estimate' "$check/bundle/report.html"
          grep -q 'Draconitic Labs' "$check/bundle/provenance.json"
          ldd "$cli/tonans"
          if grep -aq '/home/runner' "$cli/tonans"; then echo 'a build path is in tonans'; exit 1; fi
          echo '::endgroup::'

          echo '::group::tonans-desktop, from the .deb'
          deb="$dist/Tonans_${version}_amd64.deb"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          dpkg-deb -x "$deb" "$check/deb"
          grep -q 'Apache License' "$check/deb/usr/share/doc/tonans/LICENSE"
          grep -q '^## SIL Open Font License 1.1$' "$check/deb/usr/share/doc/tonans/NOTICES.md"
          cat "$check/deb/usr/share/applications/Tonans.desktop"
          grep -qx 'StartupWMClass=com.draconiticlabs.tonans' "$check/deb/usr/share/applications/Tonans.desktop"
          bare "$check/deb/usr/bin/tonans-desktop" --version | tee out.txt
          grep -Eq "$version_line" out.txt
          bare "$check/deb/usr/bin/tonans-desktop" --help | tee out.txt
          grep -q 'support@draconitic.com' out.txt
          if grep -aq '/home/runner' "$check/deb/usr/bin/tonans-desktop"; then echo 'a build path is in tonans-desktop'; exit 1; fi
          echo '::endgroup::'

          echo '::group::tonans-desktop, from the .rpm'
          rpm="$dist/Tonans-${version}-1.x86_64.rpm"
          rpm -qip "$rpm"
          rpm -qp --requires "$rpm"
          rpm -qlp "$rpm"
          rpm -qp --qf 'payload size in the header: %{LONGARCHIVESIZE}\n' "$rpm"
          # bsdtar, not rpm2cpio: Ubuntu 22.04's rpm2cpio exits 1, silently, when the
          # header records no payload size, and the Tauri bundler's .rpm records none.
          mkdir "$check/rpm"
          bsdtar -xf "$rpm" -C "$check/rpm"
          grep -q 'Apache License' "$check/rpm/usr/share/doc/tonans/LICENSE"
          grep -q '^## SIL Open Font License 1.1$' "$check/rpm/usr/share/doc/tonans/NOTICES.md"
          grep -qx 'StartupWMClass=com.draconiticlabs.tonans' "$check/rpm/usr/share/applications/Tonans.desktop"
          bare "$check/rpm/usr/bin/tonans-desktop" --version | tee out.txt
          grep -Eq "$version_line" out.txt
          echo '::endgroup::'

          echo '::group::the .deb installs, and the installed program runs'
          sudo apt-get install -y "$deb"
          bare /usr/bin/tonans-desktop --version | tee out.txt
          grep -Eq "$version_line" out.txt
          dpkg -s tonans
          echo '::endgroup::'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tonans-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  windows:
    name: Windows package
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # packaging/package.ps1 builds with this toolchain and llvm-mingw, and
      # verify-package.ps1 reads the executable's imports with llvm-objdump.
      - name: Install the GNU/LLVM Rust toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-gnullvm --profile minimal --force-non-host
      - name: Install llvm-mingw
        run: |
          $name = "llvm-mingw-$env:LLVM_MINGW_VERSION-ucrt-x86_64"
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_MINGW_VERSION/$name.zip" -OutFile $zip
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $env:LLVM_MINGW_SHA256) { throw "llvm-mingw hashes to $actual, not the pinned $env:LLVM_MINGW_SHA256" }
          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP
          # Cargo goes before llvm-mingw on PATH, as docs/RELEASE-CHECKLIST.md says.
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $env:USERPROFILE '.cargo' }
          "TONANS_PATH=$(Join-Path $cargoHome 'bin');$(Join-Path $env:RUNNER_TEMP "$name\bin")" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Package
        run: |
          $env:PATH = "$env:TONANS_PATH;$env:PATH"
          cargo +stable-x86_64-pc-windows-gnullvm --version
          rustc +stable-x86_64-pc-windows-gnullvm --version
          .\packaging\package.ps1
      - name: Verify the package
        run: |
          $env:PATH = "$env:TONANS_PATH;$env:PATH"
          .\packaging\verify-package.ps1
      # smoke.ps1 restricts PATH to the Windows system folders itself before it runs the
      # extracted executable.
      - name: Run the packaged program from the extracted package
        run: .\packaging\smoke.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tonans-windows
          path: |
            packaging/out/tonans-*-windows-x64.zip
            packaging/out/tonans-*-windows-x64.zip.sha256
          if-no-files-found: error

  release:
    name: Draft release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the tag names this version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: release
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Tonans $GITHUB_REF_NAME" \
            --notes "Tonans $GITHUB_REF_NAME for Linux (.deb, .rpm, and the tonans command as a tarball) and Windows (the tonans command as a ZIP). Installation is in the README. SHA256SUMS covers every file."
