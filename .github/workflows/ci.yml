name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install WebKitGTK and GTK development packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev
      - name: Install pinned Rust and lint components
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test the workspace
        if: runner.os != 'Windows'
        run: cargo test --workspace --locked
      # The dialog plugin's Windows backend imports from Common Controls 6, which needs an
      # application manifest. tauri-build gives the real binary one, and a test harness does
      # not get it, so the shell's test binary would not load. Its tests are platform-neutral
      # and run on Linux; the release build and the --version step below cover the binary.
      - name: Test the workspace except the shell's test binary
        if: runner.os == 'Windows'
        run: cargo test --workspace --exclude tonans-desktop --locked
      - run: cargo build --workspace --release --locked
      - name: Smoke-test packaged command interface
        run: cargo run --release --locked -p tonans-app -- --help
      - name: Smoke-test desktop command line
        run: cargo run --release --locked -p tonans-desktop -- --version
