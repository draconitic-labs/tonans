# cargo-about configuration for the third-party notices in the Linux packages.
# `.github/workflows/release.yml` runs it once for each shipped binary. A licence not
# listed here fails the release until someone reads it and adds it.
accepted = [
    "Apache-2.0",
    "MIT",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "MIT-0",
]
targets = ["x86_64-unknown-linux-gnu"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# The workspace's own crates are Tonans, under the LICENSE file beside this notice.
private = { ignore = true }
