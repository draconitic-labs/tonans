<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tonans — Microgrid Scenario Workbench</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/palette.css">
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="/favicon.svg" alt="" width="20" height="20">
    <span class="brand-name">Tonans</span>
  </div>
  <div class="project-title">
    <h1 id="project-name">Microgrid Scenario Workbench</h1>
    <p id="project-summary" class="project-summary"></p>
  </div>
  <div class="actions">
    <span id="save-state" class="save-state" role="status"></span>
    <button id="undo" type="button" disabled>Undo</button>
    <button id="redo" type="button" disabled>Redo</button>
    <button id="save" class="primary" type="button" disabled>Save</button>
    <button id="help" type="button">Help</button>
    <button id="quit" type="button">Stop server</button>
  </div>
</header>

<noscript>
  <div class="banner critical">This interface needs JavaScript.</div>
</noscript>

<main class="shell">

  <nav class="rail" aria-label="Projects">
    <h2>Projects</h2>
    <ul id="project-list" class="project-list"></ul>
    <button id="new-project" type="button">New project</button>
  </nav>

  <section class="work">
    <!-- The workflow is drawn as a busbar: each step is a breaker, closed once done. -->
    <div id="bus" class="bus hidden" role="tablist" aria-label="Workflow"></div>
    <div id="next" class="next hidden"></div>

    <div id="views" class="views">
      <div id="empty-state" class="empty">
        <h2>Open a project, or create one.</h2>
      </div>

      <div id="view-data" class="view hidden"></div>
      <div id="view-scenarios" class="view hidden"></div>
      <div id="view-results" class="view hidden"></div>
      <div id="view-sensitivity" class="view hidden"></div>
      <div id="view-export" class="view hidden"></div>
    </div>
  </section>

</main>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<dialog id="dialog" class="dialog"></dialog>

<footer class="footer">
  <span id="workspace-path" class="footer-path"></span>
  <span id="version-badge"></span>
</footer>

<script src="/app.js" type="module"></script>
</body>
</html>
